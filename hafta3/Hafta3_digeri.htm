<p id="kutu">Renk değiştirmek için üzerime gel</p>
<script>
  const kutu = document.getElementById("kutu");
  
  kutu.addEventListener("mouseover", function () { kutu.style.color = "purple";  
  }); 
  kutu.addEventListener("mouseout", function () {     kutu.style.color = "green";   
  }); 
  </script>
